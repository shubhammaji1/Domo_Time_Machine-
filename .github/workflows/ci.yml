name: Verify npm package
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_published:
        description: Also download and verify the current npm release
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run demo
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run test:package
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            qa-report/evidence/coverage
            .artifacts/reports
  published-release:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa:audit
      - run: npm run test:e2e:published
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-release-verification
          path: |
            qa-report/evidence
            .artifacts/reports
